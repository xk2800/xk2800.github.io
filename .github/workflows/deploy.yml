name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [main]
  # Manual runs from the Actions tab, and the Sanity publish webhook
  workflow_dispatch:

# One deploy at a time; of any runs queued behind it, only the newest is kept
concurrency:
  group: pages
  cancel-in-progress: false

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v2
        env:
          # Repo variable (Settings → Secrets and variables → Actions → Variables); not a secret
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
        # path: . # The root location of your Astro project inside the repository. (optional)
        with:
          node-version: 24
          # Required: the action's auto-detection doesn't recognise bun.lock
          package-manager: bun@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
